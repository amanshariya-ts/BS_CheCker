name: Pin Bar Signal Check

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (UTC)
  workflow_dispatch:          # manual "Run" button for testing

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install ccxt pandas requests PyYAML

      - name: Run signal check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python check_signals.py

      - name: Commit updated state file
        run: |
          git config user.name "signal-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/state.json
          git diff --cached --quiet || git commit -m "state update [skip ci]"
          git push
